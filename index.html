<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Review — PRD Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --bg2: #ffffff;
    --bg3: #f0efe9;
    --border: #e4e2da;
    --border2: #ccc9bf;
    --text: #1a1916;
    --text2: #6b6860;
    --text3: #a8a59d;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --purple: #7c3aed;
    --purple-bg: #f5f3ff;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --radius: 8px;
    --font-mono: 'DM Mono', monospace;
    --font-sans: 'DM Sans', sans-serif;
    --font-serif: 'Lora', serif;
  }

  html { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; overflow: hidden; }
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    height: 58px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
    position: sticky; top: 0; background: var(--bg2); z-index: 100;
  }
  .logo { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .logo-mark { width: 22px; height: 22px; background: var(--text); border-radius: 5px; display: flex; align-items: center; justify-content: center; color: var(--bg2); font-size: 10px; font-weight: 500; }
  .header-url-wrap { position: absolute; left: 50%; transform: translateX(-50%); width: min(740px, calc(100vw - 560px)); min-width: 420px; display: flex; gap: 8px; align-items: center; }
  .header-spacer { flex: 1; }
  .header-badge { font-family: var(--font-mono); font-size: 10px; color: var(--text3); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; background: var(--bg3); flex-shrink: 0; }
  .header-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: var(--text2); flex-shrink: 0; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 420px minmax(0, 1fr); height: calc(100vh - 58px); overflow: hidden; }

  /* Left */
  .left-panel { min-height: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; background: var(--bg2); }

  .url-input { flex: 1; height: 36px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; font-family: var(--font-mono); font-size: 12px; color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; min-width: 0; }
  .url-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
  .url-input::placeholder { color: var(--text3); }
  .analyze-btn { background: var(--text); color: var(--bg2); border: none; border-radius: var(--radius); padding: 0 18px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.15s, transform 0.1s; display: flex; align-items: center; gap: 5px; height: 36px; }
  .analyze-btn:hover { background: #333; }
  .analyze-btn:active { transform: scale(0.97); }
  .analyze-btn.loading { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); cursor: not-allowed; }
  .btn-spinner { width: 10px; height: 10px; border: 1.5px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Critique panel */
  .critique-panel { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding: 18px 20px; display: flex; flex-direction: column; gap: 20px; }
  .critique-panel::-webkit-scrollbar { width: 3px; }
  .critique-panel::-webkit-scrollbar-track { background: transparent; }
  .critique-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .sec-title,
  .sec-title-bold {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    letter-spacing: 0;
  }
  .sec-title {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .sec-line { flex: 1; height: 1px; background: var(--border); }

  /* Completeness block */
  .completeness-block { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; }
  .completeness-block.is-incomplete { background: var(--red-bg); border-color: rgba(220,38,38,0.55); box-shadow: 0 0 0 3px rgba(220,38,38,0.08); }
  .completeness-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg3); border-bottom: 1px solid var(--border); }
  .completeness-block.is-incomplete .completeness-header { background: var(--red-bg); border-bottom-color: rgba(220,38,38,0.22); }
  .status-pill { font-family: var(--font-mono); font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 4px; }
  .pill-incomplete { background: var(--red); color: var(--bg2); border: 1px solid var(--red); }
  .pill-complete { background: var(--green-bg); color: var(--green); border: 1px solid rgba(22,163,74,0.15); }
  .completeness-sub { font-size: 12px; color: var(--text2); }
  .completeness-block.is-incomplete .completeness-sub { color: var(--red); font-weight: 600; }
  .missing-items { padding: 8px 14px; display: flex; flex-direction: column; gap: 5px; }
  .completeness-block.is-incomplete .missing-items { background: rgba(255,255,255,0.7); }
  .missing-row { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; color: var(--warn); line-height: 1.5; }
  .missing-icon { flex-shrink: 0; margin-top: 1px; }

  /* Summary */
  .summary-block { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .summary-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text); line-height: 1.6; transition: background 0.1s; }
  .summary-item:last-child { border-bottom: none; }
  .summary-item:hover { background: var(--bg3); }
  .summary-bullet { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; flex-shrink: 0; margin-top: 8px; }

  /* Critique */
  .critique-filter-bar { display: flex; gap: 5px; align-items: center; margin-bottom: 12px; }
  .filter-label { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }
  .filter-chip { font-family: var(--font-mono); font-size: 10px; padding: 3px 9px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); color: var(--text2); background: var(--bg3); transition: all 0.12s; user-select: none; }
  .filter-chip:hover { border-color: var(--border2); color: var(--text); }
  .filter-chip.f-all { background: var(--text); color: var(--bg2); border-color: var(--text); }
  .filter-chip.f-logic { background: var(--accent-bg); color: var(--accent); border-color: rgba(37,99,235,0.2); }
  .filter-chip.f-ux { background: var(--purple-bg); color: var(--purple); border-color: rgba(124,58,237,0.2); }
  .filter-chip.f-edge { background: var(--red-bg); color: var(--red); border-color: rgba(220,38,38,0.15); }

  .critique-group { margin-bottom: 12px; }
  .critique-group.hidden { display: none; }
  .cg-label { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); padding: 2px 0 6px; display: flex; align-items: center; gap: 6px; }
  .cg-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .cg-line { flex: 1; height: 1px; background: var(--border); }

  .critique-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 5px; transition: border-color 0.15s, box-shadow 0.15s; }
  .critique-item:last-child { margin-bottom: 0; }
  .critique-item:hover { border-color: var(--border2); box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .ci-top { display: flex; align-items: flex-start; gap: 8px; }
  .ci-num { font-family: var(--font-mono); font-size: 10px; color: var(--text3); flex-shrink: 0; margin-top: 1px; width: 16px; }
  .ci-body { flex: 1; }
  .ci-issue { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 4px; line-height: 1.5; }
  .ci-question { font-size: 11.5px; color: var(--text2); line-height: 1.65; font-family: var(--font-serif); font-style: italic; }
  .ci-tag { font-family: var(--font-mono); font-size: 9px; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; margin-top: 1px; }
  .tag-logic { background: var(--accent-bg); color: var(--accent); border: 1px solid rgba(37,99,235,0.15); }
  .tag-ux { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(124,58,237,0.15); }
  .tag-edge { background: var(--red-bg); color: var(--red); border: 1px solid rgba(220,38,38,0.12); }

  /* Empty */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text3); padding: 40px 20px; }
  .empty-text { font-size: 12px; text-align: center; line-height: 1.7; font-family: var(--font-serif); color: var(--text3); }

  /* Right */
  .right-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .right-toolbar { height: 54px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 18px; gap: 10px; background: var(--bg2); }
  .toolbar-tabs { display: flex; gap: 2px; }
  .toolbar-tab { font-family: var(--font-mono); font-size: 10px; padding: 7px 14px; border-radius: 6px; cursor: pointer; color: var(--text3); border: 1px solid transparent; transition: all 0.12s; }
  .toolbar-tab:hover { color: var(--text2); background: var(--bg3); }
  .toolbar-tab.active { color: var(--text); border-color: var(--border); background: var(--bg3); font-weight: 500; }
  .toolbar-spacer { flex: 1; }
  .toolbar-action { height: 30px; font-family: var(--font-mono); font-size: 10px; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); border-radius: 5px; padding: 0 12px; cursor: pointer; transition: all 0.12s; display: flex; align-items: center; gap: 4px; }
  .toolbar-action:hover { color: var(--text); border-color: var(--border2); }

  .prototype-wrap { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .prototype-frame { width: 100%; height: 100%; border: none; background: #fff; }

  .loading-overlay { position: fixed; inset: 58px 0 0; background: rgba(255,255,255,0.86); backdrop-filter: blur(1px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .loading-overlay.visible { opacity: 1; pointer-events: all; }
  .loading-bar-wrap { width: 180px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .loading-bar { height: 100%; background: var(--accent); border-radius: 1px; width: 0%; transition: width 0.4s ease; }
  .loading-label { font-family: var(--font-mono); font-size: 11px; color: var(--text2); }
  .loading-step { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }
  .critique-panel.is-loading { background: var(--bg2); }

  .wireflow-view { flex: 1; overflow-y: auto; padding: 24px; display: none; }
  .wireflow-view.active { display: block; }

  @media (max-width: 1180px) {
    .header-url-wrap { width: min(620px, calc(100vw - 430px)); min-width: 360px; }
    main { grid-template-columns: 380px minmax(0, 1fr); }
  }

  @media (max-width: 920px) {
    .header-url-wrap { position: static; transform: none; flex: 1; width: auto; min-width: 0; }
    .header-badge { display: none; }
    main { grid-template-columns: 340px minmax(0, 1fr); }
    .critique-panel { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-mark">DR</div>design·review</div>
  <div class="header-url-wrap">
    <input class="url-input" id="url-input" placeholder="https://confluence.shopee.io/x/..." value="https://confluence.shopee.io/display/SCPM/Chat+UI+Revamp" />
    <button class="analyze-btn" id="analyze-btn" onclick="startAnalysis()">
      <span id="btn-text">Analyze</span>
    </button>
  </div>
  <div class="header-spacer"></div>
  <div class="header-badge">Claude Sonnet 4.6</div>
  <div class="header-avatar">AG</div>
</header>

<main>
  <div class="left-panel">
    <div class="critique-panel" id="critique-panel">
      <div class="empty-state">
        <div class="empty-text">输入 Confluence 链接<br>点击 Analyze 开始分析</div>
      </div>
    </div>

  </div>

  <div class="right-panel">
    <div class="right-toolbar">
      <div class="toolbar-tabs">
        <div class="toolbar-tab active" onclick="switchTab(this,'prototype')">Prototype</div>
        <div class="toolbar-tab" onclick="switchTab(this,'wireflow')">Wireflow</div>
      </div>
      <div class="toolbar-spacer"></div>
      <div class="toolbar-action" onclick="copyShare(this)">⎘ Share</div>
      <div class="toolbar-action">↓ Export</div>
    </div>

    <div class="prototype-wrap" id="prototype-wrap">
      <iframe class="prototype-frame" id="prototype-frame" srcdoc=""></iframe>
    </div>
    <div class="wireflow-view" id="wireflow-view"></div>
  </div>
</main>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-label" id="loading-label">Fetching PRD...</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  <div class="loading-step" id="loading-step">Connecting to Confluence</div>
</div>

<script>
const MOCK = {
  complete: false,
  missing: ['Mockup / 设计示例（无原型图或参考）','异常/边界场景未定义（断网、权限、空状态）'],
  summary: [
    '取消横向 Chat Tab，改为右侧 Side Bar 承载所有渠道会话列表',
    'Side Bar 分三类：Real Time（Chat + Social Private + Call）、NRT（Email / Webform / Social Public）、Case',
    'Case Field、Case Summary、Internal Note 从左侧迁移至右侧 Side Bar',
    '顶部栏新增 Agent Console 快速入口按钮，位置待定（左 or 右）',
    '新增 Filter 支持快速筛选会话，各渠道信息结构差异化展示',
  ],
  critiques: {
    logic: [
      { issue: '四种 Case Summary 组合逻辑冲突', question: 'AA+新UI / AA+旧UI / SOPA+新UI / SOPA+旧UI 展示逻辑不同，设计师需要出几套方案？这直接影响设计排期。' },
      { issue: 'Case Field 必填字段梳理未完成', question: 'PRD 附了 spreadsheet 链接但内容未在文档内呈现，升级/不升级两种场景的必填逻辑差异是否已确认？' },
      { issue: 'Supervisor 视角完全缺失', question: 'Filter 展示逻辑里 Supervisor 标注"？？"，这个角色的 Side Bar 内容需要单独设计吗？还是复用 Agent 视角？' },
    ],
    ux: [
      { issue: 'Agent Console 入口位置未决策', question: '顶部 bar 左侧还是右侧？PRD 列出两个选项但未给出决策依据，这个位置直接影响整体布局的视觉重心。' },
      { issue: 'Hybrid skill Agent 分类展示', question: '同时处理 chat + email 的 Agent，Real Time 和 NRT 会话如何分类？切换逻辑是什么？' },
      { issue: 'Social Media Public vs Private 视觉一致性', question: '两者信息结构不同，在同一 Side Bar 里如何保持一致性，不让 Agent 混淆渠道类型？' },
    ],
    edge: [
      { issue: 'Internal Note 必填阻断交互方式', question: '必填场景下是阻断式弹出（强制填写才能关闭）还是非阻断提示？对 Agent 工作效率影响截然不同。' },
      { issue: '断网 / 空状态未定义', question: 'Side Bar 无会话、网络断开、加载失败时分别展示什么？这些边界状态在 PRD 中完全缺失。' },
      { issue: 'Chaser 倒计时与 SLA 双计时冲突', question: '同一会话同时显示 SLA 和 Chaser 倒计时，哪个更紧急时如何处理视觉冲突？' },
    ]
  }
};

const GROUPS = [
  { key:'logic', label:'产品逻辑', dot:'#2563eb' },
  { key:'ux',    label:'UX 交互',  dot:'#7c3aed' },
  { key:'edge',  label:'Edge Case', dot:'#dc2626' },
];

function renderResults(data) {
  const panel = document.getElementById('critique-panel');

  const missingHTML = data.missing.map(m =>
    `<div class="missing-row"><span class="missing-icon">↳</span><span>${m}</span></div>`
  ).join('');

  const summaryHTML = data.summary.map(s =>
    `<div class="summary-item"><div class="summary-bullet"></div><span>${s}</span></div>`
  ).join('');

  const totalCount = Object.values(data.critiques).reduce((a,g) => a + g.length, 0);

  const critiqueGroupsHTML = GROUPS.map(g => {
    const items = data.critiques[g.key] || [];
    if (!items.length) return '';
    const itemsHTML = items.map((c,i) => `
      <div class="critique-item">
        <div class="ci-top">
          <div class="ci-num">${String(i+1).padStart(2,'0')}</div>
          <div class="ci-body">
            <div class="ci-issue">${c.issue}</div>
            <div class="ci-question">${c.question}</div>
          </div>
          <div class="ci-tag tag-${g.key}">${g.key}</div>
        </div>
      </div>`).join('');
    return `
      <div class="critique-group" data-group="${g.key}">
        <div class="cg-label">
          <div class="cg-dot" style="background:${g.dot}"></div>
          ${g.label} <span style="opacity:0.6">(${items.length})</span>
          <div class="cg-line"></div>
        </div>
        ${itemsHTML}
      </div>`;
  }).join('');

  panel.innerHTML = `
    <div>
      <div class="sec-head"><div class="sec-title">Completeness</div><div class="sec-line"></div></div>
      <div class="completeness-block ${data.complete ? 'is-complete':'is-incomplete'}">
        <div class="completeness-header">
          <div class="status-pill ${data.complete ? 'pill-complete':'pill-incomplete'}">${data.complete ? 'Complete':'Incomplete'}</div>
          <div class="completeness-sub">${data.missing.length > 0 ? `缺少 ${data.missing.length} 项关键信息`:'所有维度已覆盖'}</div>
        </div>
        ${data.missing.length ? `<div class="missing-items">${missingHTML}</div>`:'' }
      </div>
    </div>

    <div>
      <div class="sec-head"><div class="sec-title-bold">设计改动点</div><div class="sec-line"></div></div>
      <div class="summary-block">${summaryHTML}</div>
    </div>

    <div>
      <div class="sec-head"><div class="sec-title">Critique · ${totalCount} items</div><div class="sec-line"></div></div>
      <div class="critique-filter-bar">
        <span class="filter-label">filter</span>
        <span class="filter-chip f-all" onclick="setFilter('all',this)">All</span>
        <span class="filter-chip" onclick="setFilter('logic',this)">产品逻辑</span>
        <span class="filter-chip" onclick="setFilter('ux',this)">UX</span>
        <span class="filter-chip" onclick="setFilter('edge',this)">Edge</span>
      </div>
      <div id="critique-groups">${critiqueGroupsHTML}</div>
    </div>`;

  document.getElementById('prototype-frame').srcdoc = getProtoHTML();
}

function setFilter(type, el) {
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.className = 'filter-chip';
  });
  const classMap = { all:'f-all', logic:'f-logic', ux:'f-ux', edge:'f-edge' };
  el.classList.add(classMap[type]);
  document.querySelectorAll('.critique-group').forEach(g => {
    g.classList.toggle('hidden', type !== 'all' && g.dataset.group !== type);
  });
}

function startAnalysis() {
  const btn = document.getElementById('analyze-btn');
  const btnText = document.getElementById('btn-text');
  const panel = document.getElementById('critique-panel');
  const overlay = document.getElementById('loading-overlay');
  const bar = document.getElementById('loading-bar');
  const label = document.getElementById('loading-label');
  const step = document.getElementById('loading-step');

  btn.classList.add('loading'); btn.disabled = true;
  btnText.innerHTML = '<span class="btn-spinner"></span> Analyzing';
  panel.innerHTML = '';
  panel.classList.add('is-loading');
  bar.style.width = '0%';
  overlay.classList.add('visible');

  const steps = [
    { label:'Fetching PRD...', step:'Connecting to Confluence', pct:15 },
    { label:'Parsing content...', step:'Reading page structure', pct:35 },
    { label:'Evaluating completeness...', step:'Running Claude analysis', pct:55 },
    { label:'Generating Critique...', step:'Identifying design risks', pct:75 },
    { label:'Building Prototype...', step:'Generating interactive wireflow', pct:92 },
    { label:'Done', step:'Rendering output', pct:100 },
  ];
  let i = 0;
  function next() {
    if (i >= steps.length) {
      setTimeout(() => {
        overlay.classList.remove('visible');
        panel.classList.remove('is-loading');
        btn.classList.remove('loading'); btn.disabled = false;
        btnText.textContent = 'Analyze';
        renderResults(MOCK);
      }, 300);
      return;
    }
    const s = steps[i++];
    label.textContent = s.label; step.textContent = s.step; bar.style.width = s.pct + '%';
    setTimeout(next, 550 + Math.random() * 350);
  }
  next();
}

function switchTab(el, tab) {
  document.querySelectorAll('.toolbar-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const pw = document.getElementById('prototype-wrap');
  const wv = document.getElementById('wireflow-view');
  pw.style.display = tab === 'prototype' ? 'block' : 'none';
  wv.style.display = tab === 'wireflow' ? 'block' : 'none';
  if (tab === 'wireflow') wv.innerHTML = `<div style="color:var(--text3);font-family:var(--font-mono);font-size:11px">Wireflow view — coming soon</div>`;
}

function copyShare(btn) {
  const orig = btn.textContent;
  btn.textContent = '✓ Copied';
  setTimeout(() => btn.textContent = orig, 1500);
}
